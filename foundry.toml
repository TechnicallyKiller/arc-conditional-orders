[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# REQUIRED. Without this the USDC precompile at 0x1800... returns OpcodeNotFound and every
# test that moves value fails - or worse, passes against semantics Arc does not have.
# Verified 2026-09-19: stock Foundry cannot execute an Arc USDC transfer at all.
network = "arc"
fs_permissions = [{ access = "read", path = "./data" }]

# Arc mainnet fork is the DEFAULT test environment. A suite that passes against
# mocks proves nothing about the deployed system.
[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

[fmt]
line_length = 118
